# Publishes the do_you_love_me/ folder to GitHub Pages: https://huseyinbaranisik.github.io/do_you_love_me/
name: pages

on:
  push:
    branches: [main]
    paths: ["do_you_love_me/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: do_you_love_me
      - id: deployment
        uses: actions/deploy-pages@v4
